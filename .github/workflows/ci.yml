name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install dvc-s3

      - name: Configure DagsHub authentication
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin access_key_id "$DAGSHUB_TOKEN"
          dvc remote modify origin secret_access_key "$DAGSHUB_TOKEN"

      - name: Pull dataset
        run: |
          dvc pull

      - name: Run tests
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t predictive-maintenance-mlops:ci .